services:
  postgres:
    image: postgres:16-alpine
    container_name: ffms-postgres
    environment:
      POSTGRES_DB: financial_flow_db
      POSTGRES_USER: ffms_user
      POSTGRES_PASSWORD: ffms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
